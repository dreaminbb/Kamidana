global:
  hide_in_fullscreen: true
  launch_at_login: false
  display_targets:
    - kind: primary
  bar_padding:
    top: 0
    leading: 0
    trailing: 0
  style:
    background: "#1e1e2e"
    color: "#cdd6f4"
    opacity: 0.6
    padding:
      top: 6
      bottom: 9
      leading: 12
      trailing: 12
    spacing: 8
    corner_radius: 12
    material: ultra_thin
    animation:
      preset: ease_in_out
      duration_seconds: 0.2
    states:
      hover:
        background: "#45475a"
        opacity: 0.8
      pressed:
        opacity: 0.88
      warning:
        color: "#fab387"
      critical:
        color: "#f38ba8"
    border:
      width: 1
      color: "#585b70"
  popup_style:
    background: "#1e1e2e"
    color: "#cdd6f4"
    opacity: 0.96
    padding: 12
    spacing: 8
    corner_radius: 12
    material: ultra_thin
    border:
      width: 1
      color: "#585b70"

external:
  left:
    style:
      spacing: 30
    widgets:
      - id: system-actions
        type: system-action
        activate: hover
        animation: dynamic
        icon: ""
        folded_icon: "󰀵"
        popup_style:
          corner_radius: 14
          border:
            width: 1
            color: "#585b70"
        children:
          - id: about-this-mac
            type: about-this-mac
            format: "About this Mac"
            icon: "󰌢"
            style:
              icon_color: "#94e2d5"
          - id: sleep
            type: sleep
            format: "Sleep"
            icon: "󰒲"
            style:
              icon_color: "#94e2d5"
          - id: reboot
            type: reboot
            format: "Reboot"
            icon: "󰑐"
            style:
              icon_color: "#fab387"
          - id: shutdown
            type: shutdown
            format: "Shutdown"
            icon: "⏻"
            style:
              icon_color: "#f38ba8"
          - id: lock-screen
            type: lock-screen
            format: "Lock Screen"
            icon: "󰌾"
            style:
              icon_color: "#f5c2e7"
      - id: network
        type: network
        animation: dynamic
        format: "{connection_icon} {network_name} 󰕝 {upload}/s 󰓅 {download}/s"
        style:
          color: "#cdd6f4"
          icon_color: "#94e2d5"
        tooltip: true
        tooltip_format: "Network"
      - id: volume
        type: volume
        animation: dynamic
        format: "󰕾 {volume}%"
        input_management: true
        output_management: true
        style:
          color: "#cdd6f4"
          icon_color: "#89b4fa"

  center:
    center_default: music
    style:
      corner_radius: 16
    widgets:
      - id: music
        type: music
        animation: dynamic
        normal:
          format: "{artwork} {title}"
          format_on_action: "{artwork} {slider}"
          slider_change: "#cdd6f4"
          slider_pause: "#a6e3a1"
          slider_bar: "#89b4fa"
          extend: right
          artwork_spin: 10
        on_action:
          format: "{title} - {album}"
          artwork_spin: 10
        style:
          color: "#cdd6f4"
          icon_color: "#f5c2e7"
        popup_style:
          corner_radius: 20
          border:
            width: 1
            color: "#89b4fa"
        part_styles:
          media:
            color: "#cdd6f4"
          media_slider:
            opacity: 0.85
          sound_visualizer:
            color: "#89b4fa"
      - id: btop
        type: btop
        compact_format: ""
        width: 700
        height: 400

  right:
    style:
      spacing: 25
    widgets:
      - id: cpu
        type: cpu
        animation: dynamic
        format: "󰍛 {usage}%"
        style:
          color: "#a6e3a1"
          icon_color: "#a6e3a1"
        tooltip: true
        tooltip_format: "CPU {usage}%"
        interval: 2
      - id: gpu
        type: gpu
        animation: dynamic
        format: "󰢮 {usage}%"
        style:
          color: "#89b4fa"
          icon_color: "#89b4fa"
      - id: memory
        type: memory
        animation: dynamic
        format: " {used_gb} GB"
        style:
          color: "#cba6f7"
          icon_color: "#cba6f7"
      - id: disk
        type: disk
        animation: dynamic
        format: "󰋊 {used}"
        style:
          color: "#fab387"
          icon_color: "#fab387"
      - id: bluetooth
        type: bluetooth
        animation: dynamic
        format: "󰂯 {device}"
        style:
          color: "#cdd6f4"
          icon_color: "#89b4fa"
      - id: battery
        type: battery
        animation: dynamic
        icon:
          charging_right_now: "󰂄"
          100_capacity: "󰁹"
          90_capacity: "󰂂"
          80_capacity: "󰂁"
          70_capacity: "󰂀"
          60_capacity: "󰁿"
          50_capacity: "󰁾"
          40_capacity: "󰁽"
          30_capacity: "󰁼"
          20_capacity: "󰁹"
          10_capacity: "󰁻"
          sub_10_charged: "󰂃"
        format: "󰁹 {capacity}%"
        style:
          color: "#cdd6f4"
          icon_color: "#a6e3a1"
      - id: clock
        type: clock
        format: "{date} {time}"
        style:
          color: "#cdd6f4"

