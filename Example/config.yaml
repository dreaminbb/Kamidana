# Kamidana v1 configuration. Place this file at ~/.config/kamidana/config.yaml.
global:
  background_mode: per_widget
  hide_in_fullscreen: true
  style:
    background: "#1e1e2e"
    color: "#cdd6f4"
    opacity: 0.6
    padding: 6
    corner_radius: 12
    material: ultra_thin

left:
  style:
    spacing: 8
  widgets:
    - id: system-actions
      type: system-action
      icon: "󰀵"
      folded_icon: "󰉋"
      children:
        - id: about-this-mac
          type: about-this-mac
          format: "About this Mac"
          icon: "󰌢"
          style:
            icon_color: "#94e2d5"
        - id: sleep
          type: sleep
          format: "Sleep"
          icon: "󰒲"
          style:
            icon_color: "#94e2d5"
        - id: reboot
          type: reboot
          format: "Reboot"
          icon: "󰑐"
          style:
            icon_color: "#fab387"
        - id: shutdown
          type: shutdown
          format: "Shutdown"
          icon: "⏻"
          style:
            icon_color: "#f38ba8"
        - id: lock-screen
          type: lock-screen
          format: "Lock Screen"
          icon: "󰌾"
          style:
            icon_color: "#f5c2e7"
    - id: wifi
      type: wifi
      format: "󰤨 {ssid}"
      style:
        color: "#cdd6f4"
        icon_color: "#f5c2e7"
    - id: volume
      type: volume
      format: "󰕾 {volume}%"
      style:
        color: "#cdd6f4"
        icon_color: "#89b4fa"

center:
  center_default: music
  style:
    corner_radius: 16
  widgets:
    - id: music
      type: music
      format: "󰝚 {title}"
      compact_format: "󰝚 {title}"
      style:
        color: "#cdd6f4"
        icon_color: "#f5c2e7"
      part_styles:
        media:
          color: "#cdd6f4"
        media_slider:
          opacity: 0.85
        sound_visualizer:
          color: "#89b4fa"
    - id: btop
      type: btop
      compact_format: ""

right:
  style:
    spacing: 8
  widgets:
    - id: network
      type: network
      format: "󰕝 {upload}/s 󰓅 {download}/s"
      style:
        color: "#cdd6f4"
        icon_color: "#94e2d5"
      tooltip: true
      tooltip_format: "Network"
    - id: cpu
      type: cpu
      format: "󰍛 {usage}%"
      # color styles text and placeholder values; icon_color styles Nerd Font glyphs.
      style:
        color: "#a6e3a1"
        icon_color: "#a6e3a1"
      tooltip: true
      tooltip_format: "{usage}%"
      interval: 2
    - id: gpu
      type: gpu
      format: "󰢮 {usage}%"
      style:
        color: "#89b4fa"
        icon_color: "#89b4fa"
    - id: memory
      type: memory
      format: "󰘚 {used_gb} GB"
      style:
        color: "#cba6f7"
        icon_color: "#cba6f7"
    - id: disk
      type: disk
      format: "󰋊 {used}"
      style:
        color: "#fab387"
        icon_color: "#fab387"
    - id: bluetooth
      type: bluetooth
      format: "󰂯"
      style:
        color: "#cdd6f4"
        icon_color: "#89b4fa"
    - id: battery
      type: battery
      format: "󰁹 {capacity}%"
      style:
        color: "#cdd6f4"
        icon_color: "#a6e3a1"
    - id: clock
      type: clock
      format: "{date} {time}"
      style:
        color: "#cdd6f4"
